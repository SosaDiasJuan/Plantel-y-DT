spring.application.name=plantel-y-dt

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/plantel_y_dt?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# Los valores por defecto preservan la puesta en marcha local existente.
# En entornos compartidos o productivos, definir DB_USERNAME y DB_PASSWORD.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
